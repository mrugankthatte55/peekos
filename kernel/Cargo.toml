[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
test = false
bench = false

[features]
# Enabled by `cargo xtask test`: on a clean boot the kernel asks QEMU to exit
# (via the isa-debug-exit device) instead of halting, so CI can check the code.
boot-test = []

[dependencies]
# Just the interface the bootloader hands the kernel (entry point + BootInfo).
# The bootloader implementation itself is pulled in by xtask, not here.
bootloader_api = "0.11"
# A spinlock Mutex that works with no OS underneath — used for the global
# serial port so the print macros can be called from anywhere.
spin = "0.9"
