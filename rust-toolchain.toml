# Pinned so every machine (macOS, Windows) and CI build with the exact same
# compiler. Bump deliberately, not incidentally.
#
# Why nightly: the `x86-interrupt` calling convention, needed for CPU interrupt
# handlers later on, is still unstable.
[toolchain]
channel = "nightly-2026-08-29"
components = ["rust-src", "llvm-tools", "clippy", "rustfmt"]
targets = ["x86_64-unknown-none"]
profile = "minimal"
